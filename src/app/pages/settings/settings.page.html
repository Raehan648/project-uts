<ion-header>
  <ion-toolbar class="s-toolbar">
    <ion-title class="s-title">Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="s-content" [scrollY]="true">

  <!-- Profile Card -->
  <div class="profile-card" (click)="editProfile()">
    <div class="pc-avatar">
      <ion-icon name="person" class="pc-icon"></ion-icon>
    </div>
    <div class="pc-info">
      <div class="pc-name">{{ userName }}</div>
      <div class="pc-city">📍 {{ cityName }}</div>
      <div class="pc-method">🌙 Metode: {{ prayerMethod }}</div>
    </div>
    <ion-icon name="chevron-forward" class="pc-arrow"></ion-icon>
  </div>

  <!-- NOTIFIKASI -->
  <div class="section-label">NOTIFIKASI</div>
  <div class="card-group">
    <div class="card-row">
      <div class="row-icon" style="background:#c9973a22;">🔔</div>
      <div class="row-body">
        <div class="row-title">Adzan Pengingat</div>
        <div class="row-sub">5 menit sebelum waktu</div>
      </div>
      <ion-toggle [(ngModel)]="notifAdzan" (ionChange)="toggleNotifAdzan()" class="my-toggle"></ion-toggle>
    </div>
    <div class="divider-line"></div>
    <div class="card-row">
      <div class="row-icon" style="background:#e8923022;">🌅</div>
      <div class="row-body">
        <div class="row-title">Dzikir Pagi</div>
        <div class="row-sub">Setelah Subuh</div>
      </div>
      <ion-toggle [(ngModel)]="notifDzikir" (ionChange)="toggleNotifDzikir()" class="my-toggle"></ion-toggle>
    </div>
  </div>

</ion-content>
